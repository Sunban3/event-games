<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>わんにゃんタワーバトル</title>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, #cdeaff 0%, #fef6e4 100%);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #game-container {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #eaf6ff;
    display: block;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
    border-radius: 8px;
    max-height: 100vh;
    max-width: 100vw;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.45);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .hidden { display: none !important; }
  h1 {
    font-size: 1.5em;
    margin: 0 0 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  .subtitle {
    font-size: 0.95em;
    margin-bottom: 24px;
    opacity: 0.92;
    line-height: 1.7;
  }
  .subtitle b { color: #ffd166; }
  button.main-btn {
    font-size: 1.2em;
    padding: 12px 36px;
    border-radius: 30px;
    border: none;
    background: #ff6b6b;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  button.main-btn:active { transform: scale(0.96); }
  button.main-btn:disabled { opacity: 0.6; cursor: default; }
  #hud {
    position: absolute;
    top: 14px; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    color: #3a3226;
    text-shadow: 0 1px 2px rgba(255,255,255,0.7);
  }
  #hud .score { font-size: 1.7em; font-weight: bold; }
  #hud .sub { font-size: 0.85em; opacity: 0.8; }
  .final-score {
    font-size: 2.2em;
    margin: 10px 0 24px;
    color: #ffd166;
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud" class="hidden">
    <div class="score" id="scoreText">0</div>
    <div class="sub" id="countText">0匹</div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>🐶 わんにゃんタワーバトル 🐱</h1>
    <div class="subtitle">
      ねこや いぬを ゆびで うごかしてね。<br>
      はなすと おちるよ。<br>
      たかく つみあげよう!<br>
      だいから おちたら おしまい。<br>
      おおきい こは ぐらぐらするから ちゅうい!
    </div>
    <button class="main-btn" id="startBtn">はじめる</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1>タワーがくずれた…！</h1>
    <div class="final-score" id="finalScore">0</div>
    <button class="main-btn" id="retryBtn">もう一回！</button>
  </div>
</div>

  ];
  const TOTAL_WEIGHT = ANIMAL_SPECS.reduce((s, a) => s + a.weight, 0);

  startBtn.disabled = true;
  startBtn.textContent = '読み込み中…';
  let loadedCount = 0;
  ANIMAL_SPECS.forEach(spec => {
    const img = new Image();
    img.onload = img.onerror = () => {
      loadedCount++;
      if (loadedCount === ANIMAL_SPECS.length) {
        startBtn.disabled = false;
        startBtn.textContent = 'はじめる';
      }
    };
    img.src = spec.img;
    spec.imageEl = img;
  });

  function pickSpec() {
    let r = Math.random() * TOTAL_WEIGHT;
    for (const spec of ANIMAL_SPECS) {
      if (r < spec.weight) return spec;
      r -= spec.weight;
    }
    return ANIMAL_SPECS[0];
  }

  let W, H, groundY, previewScreenY, platformWidth;
  let state = 'menu'; // menu | playing | gameover
  let engine, world, preview, cameraY, score, count, controllable, settleCounter, pendingSettleBody, pointerActive;

  function resize() {
    const vw = window.innerWidth || document.documentElement.clientWidth || 480;
    const vh = window.innerHeight || document.documentElement.clientHeight || 720;
    if (vw <= 0 || vh <= 0) return;
    W = Math.min(vw, 480);
    H = vh;
    canvas.width = W;
    canvas.height = H;
    groundY = H * 0.82;
    previewScreenY = H * 0.14;
    platformWidth = Math.min(240, W - 60);
  }
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resize(); });
  window.addEventListener('pageshow', resize);
  resize();

  function createBody(spec, x, y) {
    const opts = { restitution: 0.05, friction: 0.7, frictionStatic: 1.2, density: 0.0015 };
    let body;
    if (spec.shape === 'circle') {
      body = Matter.Bodies.circle(x, y, spec.r, opts);
    } else {
      body = Matter.Bodies.rectangle(x, y, spec.w, spec.h, Object.assign({ chamfer: { radius: Math.min(8, spec.h / 4) } }, opts));
    }
    body.spec = spec;
    return body;
  }

  function previewHalfWidth() {
    return preview.spec.shape === 'circle' ? preview.spec.r : preview.spec.w / 2;
  }

  function clampPreviewX(x) {
    const half = previewHalfWidth();
    const minX = W / 2 - platformWidth / 2 + half + 4;
    const maxX = W / 2 + platformWidth / 2 - half - 4;
    return Math.max(minX, Math.min(maxX, x));
  }

  function spawnPreview() {
    const spec = pickSpec();
    preview = { spec, x: W / 2, y: previewScreenY + cameraY };
  }

  function resetGame() {
    engine = Matter.Engine.create({ positionIterations: 10, velocityIterations: 8 });
    engine.world.gravity.y = 1.2;
    world = engine.world;
    const groundBody = Matter.Bodies.rectangle(W / 2, groundY, platformWidth, 20, { isStatic: true, friction: 0.9 });
    Matter.Composite.add(world, groundBody);
    cameraY = 0;
    score = 0;
    count = 0;
    controllable = true;
    settleCounter = 0;
    pendingSettleBody = null;
    pointerActive = false;
    spawnPreview();
  }

  function doDrop() {
    if (!controllable || !preview) return;
    const body = createBody(preview.spec, preview.x, preview.y);
    Matter.Composite.add(world, body);
    controllable = false;
    settleCounter = 0;
    pendingSettleBody = body;
  }

  function updatePreviewX(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scale = rect.width > 0 ? (W / rect.width) : 1;
    const x = (clientX - rect.left) * scale;
    preview.x = clampPreviewX(x);
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (state !== 'playing' || !controllable) return;
    pointerActive = true;
    updatePreviewX(e.clientX);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointerActive) return;
    updatePreviewX(e.clientX);
  });
  window.addEventListener('pointerup', () => {
    if (pointerActive) {
      pointerActive = false;
      if (state === 'playing' && controllable) doDrop();
    }
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && state === 'playing' && controllable) doDrop();
  });

  function computeTopY() {
    let topY = groundY;
    Matter.Composite.allBodies(world).forEach(b => {
      if (!b.isStatic && b !== pendingSettleBody) topY = Math.min(topY, b.bounds.min.y);
    });
    return topY;
  }

  function updateCamera(dt) {
    const topY = computeTopY();
    const towerHeight = groundY - topY;
    const desiredCameraY = Math.max(0, towerHeight - (groundY - H * 0.35));
    cameraY += (desiredCameraY - cameraY) * Math.min(1, dt * 4);
  }

  function handleSettle() {
    if (controllable || !pendingSettleBody) return;
    const b = pendingSettleBody;
    if (b.speed < 0.15 && b.angularSpeed < 0.06) settleCounter++;
    else settleCounter = 0;
    if (settleCounter > 18) {
      pendingSettleBody = null;
      count++;
      countText.textContent = count + '匹';
      spawnPreview();
      controllable = true;
    }
  }

  function checkGameOver() {
    for (const b of Matter.Composite.allBodies(world)) {
      if (b.isStatic) continue;
      const screenY = b.position.y - cameraY;
      if (screenY > H + 80) return true;
    }
    return false;
  }

  function drawAnimal(spec, x, y, angle) {
    if (!spec.imageEl || !spec.imageEl.complete || spec.imageEl.naturalWidth === 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.drawImage(spec.imageEl, spec.offX, spec.offY, spec.drawW, spec.drawH);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.translate(0, -cameraY);

    ctx.fillStyle = '#c9a876';
    ctx.strokeStyle = '#8a6a3f';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(W / 2 - platformWidth / 2, groundY - 10, platformWidth, 20, 6);
    ctx.fill();
    ctx.stroke();

    Matter.Composite.allBodies(world).forEach(b => {
      if (b.isStatic) return;
      drawAnimal(b.spec, b.position.x, b.position.y, b.angle);
    });

    if (preview && state === 'playing') {
      ctx.save();
      ctx.globalAlpha = controllable ? 1 : 0.45;
      drawAnimal(preview.spec, preview.x, preview.y, 0);
      ctx.restore();
    }

    ctx.restore();
  }

  let lastTime = null;
  function loop(ts) {
    if (state !== 'playing') { lastTime = null; return; }
    if (lastTime === null) lastTime = ts;
    const dtMs = Math.min(50, ts - lastTime);
    lastTime = ts;

    Matter.Engine.update(engine, dtMs);
    updateCamera(dtMs / 1000);
    if (preview) preview.y = previewScreenY + cameraY;
    handleSettle();

    const topY = computeTopY();
    score = Math.max(0, Math.round((groundY - topY) / 6));
    scoreText.textContent = score;

    if (checkGameOver()) { endGame(); return; }

    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resetGame();
    state = 'playing';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    scoreText.textContent = '0';
    countText.textContent = '0匹';
    lastTime = null;
    requestAnimationFrame(loop);
  }

  function endGame() {
    state = 'gameover';
    hud.classList.add('hidden');
    finalScoreEl.textContent = score;
    gameOverScreen.classList.remove('hidden');
    draw();
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  // idle initial draw
  resetGame();
  draw();
})();
</script>
</body>
</html>
