<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>たこ焼きタイミングタップ</title>
<style>
  :root{
    --bg1:#3a2418;
    --bg2:#1f130b;
    --accent:#e6483c;
    --accent-dark:#b8332a;
    --gold:#e8b23c;
    --cream:#fff2e0;
    --ok:#3cb46a;
    --hayai:#4a90d9;
    --burnt:#8a3a2a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--bg1), var(--bg2));
    color:var(--cream);
    overscroll-behavior:none;
    user-select:none;
    touch-action:manipulation;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:12px;
  }
  .screen{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .hidden{display:none !important;}

  h1.title{
    font-size:clamp(22px,6vw,34px);
    color:var(--gold);
    margin:18px 0 8px;
    text-shadow:2px 2px 0 rgba(0,0,0,0.4);
  }
  p.sub{
    font-size:clamp(13px,3vw,16px);
    color:#f0d9b8;
    margin:0 0 16px;
    line-height:1.7;
  }
  .legend{
    display:flex;
    gap:14px;
    justify-content:center;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    background:rgba(255,255,255,0.08);
    padding:6px 12px;
    border-radius:20px;
  }
  .dot{width:14px; height:14px; border-radius:50%; display:inline-block;}

  button{font-family:inherit; border:none; cursor:pointer;}
  .btn-primary{
    background:linear-gradient(180deg,#ff8a5c,var(--accent));
    color:#fff;
    font-size:clamp(18px,4.5vw,22px);
    font-weight:bold;
    padding:14px 46px;
    border-radius:50px;
    box-shadow:0 6px 0 var(--accent-dark), 0 8px 14px rgba(0,0,0,0.3);
    transition:transform .08s;
  }
  .btn-primary:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 var(--accent-dark), 0 4px 8px rgba(0,0,0,0.3);
  }

  /* ---- HUD ---- */
  .hud{
    width:100%;
    display:flex;
    justify-content:space-between;
    max-width:480px;
    margin:6px 0 10px;
    padding:0 4px;
  }
  .hud-item{
    background:rgba(255,255,255,0.1);
    border-radius:14px;
    padding:8px 18px;
    font-weight:bold;
    font-size:clamp(14px,3.5vw,18px);
    color:var(--gold);
    min-width:90px;
  }
  .hud-item span.label{
    display:block;
    font-size:10px;
    color:#d8b98c;
    font-weight:normal;
  }
  .mini-legend{
    display:flex;
    gap:10px;
    justify-content:center;
    margin-bottom:10px;
    font-size:11px;
    color:#e0c9a8;
  }
  .mini-legend span{display:flex; align-items:center; gap:4px;}

  /* ---- Pan / board ---- */
  #pan{
    position:relative;
    width:min(92vw,440px);
    aspect-ratio:1/1;
    background:
      radial-gradient(circle at 50% 30%, #4a3325, #241610 80%);
    border-radius:24px;
    box-shadow:inset 0 0 30px rgba(0,0,0,0.6), 0 8px 18px rgba(0,0,0,0.4);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:4%;
    padding:6%;
  }
  .hole{
    position:relative;
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #17100a, #050302 75%);
    box-shadow:inset 0 4px 10px rgba(0,0,0,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:visible;
  }
  .takoyaki{
    position:absolute;
    width:78%;
    height:78%;
    border-radius:50%;
    background:#f5e6c8;
    box-shadow:inset -4px -6px 10px rgba(0,0,0,0.25), inset 4px 4px 8px rgba(255,255,255,0.25);
    transform:scale(0.4);
    will-change:transform,background-color;
  }
  .takoyaki .octo{
    position:absolute;
    top:38%; left:32%;
    width:16%; height:16%;
    border-radius:50%;
    background:#5a3a2a;
    opacity:0.8;
  }
  .takoyaki .negi{
    position:absolute;
    width:14%; height:5%;
    background:#7fbf5a;
    border-radius:3px;
  }
  .takoyaki .negi.n1{top:28%; left:55%; transform:rotate(20deg);}
  .takoyaki .negi.n2{top:60%; left:60%; transform:rotate(-15deg);}
  .takoyaki .negi.n3{top:55%; left:25%; transform:rotate(40deg);}

  .feedback{
    position:absolute;
    top:10%;
    left:50%;
    transform:translateX(-50%);
    font-weight:bold;
    font-size:15px;
    white-space:nowrap;
    pointer-events:none;
    animation:floatUp .8s ease forwards;
    text-shadow:1px 1px 2px rgba(0,0,0,0.6);
    z-index:5;
  }
  @keyframes floatUp{
    0%{opacity:1; transform:translate(-50%,0) scale(1);}
    100%{opacity:0; transform:translate(-50%,-38px) scale(1.15);}
  }

  /* ---- Result overlay ---- */
  #resultOverlay{
    position:fixed; inset:0;
    background:rgba(20,12,8,0.75);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
    z-index:20;
  }
  .result-card{
    background:#fff8ee;
    color:#3b2a20;
    border-radius:24px;
    padding:30px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    animation:pop .4s ease;
  }
  @keyframes pop{
    0%{transform:scale(0.8); opacity:0;}
    100%{transform:scale(1); opacity:1;}
  }
  .result-card h2{margin:0 0 4px; color:var(--accent-dark); font-size:22px;}
  .rank-badge{font-size:64px; font-weight:bold; margin:8px 0; line-height:1;}
  .rank-S{color:#e8b23c;}
  .rank-A{color:#e6483c;}
  .rank-B{color:#7a9ac9;}
  .result-stats{
    display:flex;
    justify-content:space-around;
    margin:14px 0 6px;
    flex-wrap:wrap;
    gap:6px;
  }
  .result-stats div{font-size:13px; color:#6b4a38; min-width:60px;}
  .result-stats strong{display:block; font-size:19px; color:#3b2a20;}
  .score-line{font-size:15px; margin:8px 0 18px; color:#6b4a38;}
  .score-line strong{color:var(--accent-dark); font-size:24px;}
</style>
</head>
<body>
<div id="app">

  <!-- Title Screen -->
  <div id="titleScreen" class="screen">
    <h1 class="title">たこ焼きタイミングタップ</h1>
    <p class="sub">アミの穴からたこ焼きが出てくるよ！<br>焼き上がりのタイミングでタップしよう。30秒間でスコアを競おう！</p>
    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:var(--hayai)"></span>はやい</div>
      <div class="legend-item"><span class="dot" style="background:var(--ok)"></span>OK！（ばっちり）</div>
      <div class="legend-item"><span class="dot" style="background:var(--burnt)"></span>こげた（遅い）</div>
    </div>
    <button class="btn-primary" id="startBtn">スタート</button>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen hidden">
    <div class="hud">
      <div class="hud-item"><span class="label">のこり</span><span id="timeDisplay">30秒</span></div>
      <div class="hud-item"><span class="label">スコア</span><span id="scoreDisplay">0</span></div>
    </div>
    <div class="mini-legend">
      <span><span class="dot" style="width:10px;height:10px;background:var(--hayai)"></span>はやい</span>
      <span><span class="dot" style="width:10px;height:10px;background:var(--ok)"></span>OK</span>
      <span><span class="dot" style="width:10px;height:10px;background:var(--burnt)"></span>こげた</span>
    </div>
    <div id="pan"></div>
  </div>

  <!-- Result Overlay -->
  <div id="resultOverlay" class="hidden">
    <div class="result-card">
      <h2>タイムアップ！</h2>
      <div class="rank-badge" id="rankBadge">S</div>
      <div class="score-line">スコア <strong id="finalScore">0</strong></div>
      <div class="result-stats">
        <div><strong id="okCount">0</strong>OK</div>
        <div><strong id="hayaiCount">0</strong>はやい</div>
        <div><strong id="burntCount">0</strong>こげた</div>
      </div>
      <button class="btn-primary" id="retryBtn" style="font-size:16px; padding:10px 34px; margin-top:10px;">もう一度あそぶ</button>
    </div>
  </div>

</div>

<script>
(function(){
  const HOLE_COUNT = 9;
  const GAME_DURATION = 30000;      // 30秒
  const LIFETIME = 2400;            // 1個のたこ焼きの寿命(ms)
  const T_HAYAI_END = 900;          // 0-900ms: はやい(早い)
  const T_OK_END = 1500;            // 900-1500ms: OK
  // 1500-2400ms: こげた(遅い) / 2400ms以降: 自動で消滅(見逃し)
  const MAX_CONCURRENT = 5;
  const SPAWN_INTERVAL = 550;

  const panEl = document.getElementById("pan");
  const titleScreen = document.getElementById("titleScreen");
  const gameScreen = document.getElementById("gameScreen");
  const resultOverlay = document.getElementById("resultOverlay");
  const timeDisplay = document.getElementById("timeDisplay");
  const scoreDisplay = document.getElementById("scoreDisplay");

  let holes = [];       // { el, occupant: null | takoyakiObj }
  let score = 0;
  let counts = {ok:0, hayai:0, burnt:0};
  let gameStartTime = 0;
  let spawnTimer = null;
  let countdownTimer = null;
  let rafId = null;
  let running = false;
  let tyIdCounter = 0;

  function buildPan(){
    panEl.innerHTML = "";
    holes = [];
    for(let i=0;i<HOLE_COUNT;i++){
      const hole = document.createElement("div");
      hole.className = "hole";
      hole.addEventListener("click", () => onHoleTap(i));
      panEl.appendChild(hole);
      holes.push({el:hole, occupant:null});
    }
  }

  function lerp(a,b,t){return a+(b-a)*t;}
  function lerpColor(c1,c2,t){
    const r = Math.round(lerp(c1[0],c2[0],t));
    const g = Math.round(lerp(c1[1],c2[1],t));
    const b = Math.round(lerp(c1[2],c2[2],t));
    return `rgb(${r},${g},${b})`;
  }
  const COLOR_RAW    = [245,230,200];
  const COLOR_GOLDEN = [232,180,80];
  const COLOR_OKBROWN= [178,120,55];
  const COLOR_BURNT  = [50,28,18];

  function colorForAge(age){
    if(age <= T_HAYAI_END){
      return lerpColor(COLOR_RAW, COLOR_GOLDEN, age/T_HAYAI_END);
    } else if(age <= T_OK_END){
      return lerpColor(COLOR_GOLDEN, COLOR_OKBROWN, (age-T_HAYAI_END)/(T_OK_END-T_HAYAI_END));
    } else {
      const t = Math.min(1, (age-T_OK_END)/(LIFETIME-T_OK_END));
      return lerpColor(COLOR_OKBROWN, COLOR_BURNT, t);
    }
  }

  function spawnTakoyaki(){
    if(!running) return;
    const filled = holes.filter(h=>h.occupant).length;
    if(filled >= MAX_CONCURRENT) return;
    const emptyIdx = holes.map((h,i)=>h.occupant?null:i).filter(i=>i!==null);
    if(emptyIdx.length === 0) return;
    const idx = emptyIdx[Math.floor(Math.random()*emptyIdx.length)];

    const el = document.createElement("div");
    el.className = "takoyaki";
    el.innerHTML = `
      <div class="octo"></div>
      <div class="negi n1"></div>
      <div class="negi n2"></div>
      <div class="negi n3"></div>`;
    holes[idx].el.appendChild(el);

    const obj = {
      id: tyIdCounter++,
      spawnTime: performance.now(),
      el,
      resolved:false
    };
    holes[idx].occupant = obj;
  }

  function removeOccupant(idx){
    const h = holes[idx];
    if(h.occupant && h.occupant.el.parentNode){
      h.occupant.el.parentNode.removeChild(h.occupant.el);
    }
    h.occupant = null;
  }

  function showFeedback(holeEl, text, color){
    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.textContent = text;
    fb.style.color = color;
    holeEl.appendChild(fb);
    setTimeout(()=>{ if(fb.parentNode) fb.parentNode.removeChild(fb); }, 820);
  }

  function onHoleTap(idx){
    if(!running) return;
    const h = holes[idx];
    const obj = h.occupant;
    if(!obj || obj.resolved) return;
    obj.resolved = true;
    const age = performance.now() - obj.spawnTime;

    let label, color, pts;
    if(age <= T_HAYAI_END){
      label = "はやい +1"; color = getCss("--hayai"); pts = 1; counts.hayai++;
    } else if(age <= T_OK_END){
      label = "OK！ +3"; color = getCss("--ok"); pts = 3; counts.ok++;
    } else {
      label = "こげた…"; color = getCss("--burnt"); pts = 0; counts.burnt++;
    }
    score += pts;
    scoreDisplay.textContent = score;
    showFeedback(h.el, label, color);
    removeOccupant(idx);
  }

  function getCss(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function tick(){
    if(!running) return;
    const now = performance.now();
    holes.forEach((h,idx)=>{
      const obj = h.occupant;
      if(!obj) return;
      const age = now - obj.spawnTime;
      if(age >= LIFETIME){
        // 見逃し(自動で焦げて消える)
        counts.burnt++;
        removeOccupant(idx);
        return;
      }
      const scale = age <= T_HAYAI_END ? lerp(0.4,1.0, age/T_HAYAI_END) : 1.0;
      obj.el.style.transform = `scale(${scale})`;
      obj.el.style.backgroundColor = colorForAge(age);
    });
    rafId = requestAnimationFrame(tick);
  }

  function calcRank(s){
    let rank = "B";
    if(s >= 90) rank = "S";
    else if(s >= 55) rank = "A";
    return rank;
  }

  function endGame(){
    running = false;
    clearInterval(spawnTimer);
    clearInterval(countdownTimer);
    cancelAnimationFrame(rafId);
    holes.forEach((h,idx)=>removeOccupant(idx));

    document.getElementById("finalScore").textContent = score;
    document.getElementById("okCount").textContent = counts.ok;
    document.getElementById("hayaiCount").textContent = counts.hayai;
    document.getElementById("burntCount").textContent = counts.burnt;
    const rank = calcRank(score);
    const badge = document.getElementById("rankBadge");
    badge.textContent = rank;
    badge.className = "rank-badge rank-" + rank;
    resultOverlay.classList.remove("hidden");
  }

  function startGame(){
    score = 0; counts = {ok:0, hayai:0, burnt:0};
    scoreDisplay.textContent = "0";
    resultOverlay.classList.add("hidden");
    buildPan();
    titleScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");

    running = true;
    gameStartTime = performance.now();
    let remaining = GAME_DURATION/1000;
    timeDisplay.textContent = remaining + "秒";

    spawnTimer = setInterval(spawnTakoyaki, SPAWN_INTERVAL);
    countdownTimer = setInterval(()=>{
      remaining--;
      timeDisplay.textContent = Math.max(0,remaining) + "秒";
      if(remaining <= 0){
        endGame();
      }
    }, 1000);
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

})();
</script>
</body>
</html>
