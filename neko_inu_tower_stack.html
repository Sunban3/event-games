<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>わんにゃんタワー</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: linear-gradient(180deg, #cdeaff 0%, #fef6e4 100%);
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  #game-container {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #eaf6ff;
    display: block;
    box-shadow: 0 0 30px rgba(0,0,0,0.15);
    border-radius: 8px;
    max-height: 100vh;
    max-width: 100vw;
  }
  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.45);
    color: #fff;
    text-align: center;
    padding: 20px;
  }
  .hidden { display: none !important; }
  h1 {
    font-size: 1.6em;
    margin: 0 0 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  .subtitle {
    font-size: 0.95em;
    margin-bottom: 24px;
    opacity: 0.92;
    line-height: 1.7;
  }
  .subtitle b { color: #ffd166; }
  button.main-btn {
    font-size: 1.2em;
    padding: 12px 36px;
    border-radius: 30px;
    border: none;
    background: #ff6b6b;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  button.main-btn:active { transform: scale(0.96); }
  #hud {
    position: absolute;
    top: 14px; left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    color: #3a3226;
    text-shadow: 0 1px 2px rgba(255,255,255,0.7);
  }
  #hud .score { font-size: 1.6em; font-weight: bold; }
  #hud .combo { font-size: 1em; color: #ff8c42; font-weight: bold; min-height: 1.2em; }
  .final-score {
    font-size: 2.2em;
    margin: 10px 0 24px;
    color: #ffd166;
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud" class="hidden">
    <div class="score" id="scoreText">0</div>
    <div class="combo" id="comboText"></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>🐶 わんにゃんタワー 🐱</h1>
    <div class="subtitle">
      タップ / クリック / スペースキーでブロックを落として積み上げよう。<br>
      ぴったり重ねると <b>PERFECT!</b> でサイズそのまま。<br>
      時々わんこの「お邪魔ブロック🐶」が来る。ズレて置くと揺れて余計に縮むので慎重に！
    </div>
    <button class="main-btn" id="startBtn">はじめる</button>
  </div>

  <div id="gameOverScreen" class="overlay hidden">
    <h1>タワーがくずれた…！</h1>
    <div class="final-score" id="finalScore">0</div>
    <button class="main-btn" id="retryBtn">もう一回！</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const scoreText = document.getElementById('scoreText');
  const comboText = document.getElementById('comboText');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  const BLOCK_HEIGHT = 38;
  const MARGIN = 14;
  const DOG_PENALTY_BASE = 46; // extra px shaved off on a sloppy dog placement
  const PERFECT_TOLERANCE = 6; // px difference counted as a perfect stack

  let W, H, topScreenY;
  let state = 'menu'; // menu | playing | gameover
  let stack, movingBlock, debris, score, combo, popups, shakeTime, shakeMag, dogChance;

  function resize() {
    const vw = window.innerWidth || document.documentElement.clientWidth || 480;
    const vh = window.innerHeight || document.documentElement.clientHeight || 720;
    if (vw <= 0 || vh <= 0) return;
    W = Math.min(vw, 480);
    H = vh;
    canvas.width = W;
    canvas.height = H;
    topScreenY = H * 0.62;
  }
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) resize(); });
  window.addEventListener('pageshow', resize);
  resize();

  function pickType() {
    return Math.random() < dogChance ? 'dog' : 'cat';
  }

  function spawnMovingBlock(width) {
    const speed = 90 + Math.min(stack.length * 4, 160);
    movingBlock = {
      width,
      x: MARGIN + width / 2,
      dir: 1,
      speed,
      type: pickType()
    };
  }

  function resetGame() {
    const baseWidth = Math.min(220, W - MARGIN * 2);
    stack = [{ x: W / 2, width: baseWidth, type: 'cat' }];
    debris = [];
    popups = [];
    score = 0;
    combo = 0;
    shakeTime = 0;
    shakeMag = 0;
    dogChance = 0.15;
    spawnMovingBlock(baseWidth);
  }

  function addPopup(text, color) {
    popups.push({ text, color, life: 0.9, y: topScreenY - 40, x: W / 2 });
  }

  function addDebris(x, y, width) {
    debris.push({
      x, y, width, height: BLOCK_HEIGHT,
      vx: (x < W / 2 ? -1 : 1) * (40 + Math.random() * 40),
      vy: -60 - Math.random() * 40,
      rot: 0,
      vrot: (Math.random() - 0.5) * 4,
      life: 1.4
    });
  }

  function drop() {
    if (state !== 'playing') return;
    const top = stack[stack.length - 1];
    const mb = movingBlock;

    const left = Math.max(mb.x - mb.width / 2, top.x - top.width / 2);
    const right = Math.min(mb.x + mb.width / 2, top.x + top.width / 2);
    const overlapWidth = right - left;

    if (overlapWidth <= 4) {
      // completely missed
      addDebris(mb.x, topScreenY - BLOCK_HEIGHT, mb.width);
      endGame();
      return;
    }

    // leftover pieces fly off
    const leftoverLeftWidth = left - (mb.x - mb.width / 2);
    const leftoverRightWidth = (mb.x + mb.width / 2) - right;
    if (leftoverLeftWidth > 1) addDebris(mb.x - mb.width / 2 + leftoverLeftWidth / 2, topScreenY - BLOCK_HEIGHT, leftoverLeftWidth);
    if (leftoverRightWidth > 1) addDebris(right + leftoverRightWidth / 2, topScreenY - BLOCK_HEIGHT, leftoverRightWidth);

    const isPerfect = (top.width - overlapWidth) <= PERFECT_TOLERANCE;
    let newWidth = isPerfect ? top.width : overlapWidth;
    let newX = isPerfect ? top.x : (left + right) / 2;

    if (mb.type === 'dog' && !isPerfect) {
      const centeredness = overlapWidth / mb.width; // 1 = untouched, 0 = barely clipped
      const extraShrink = DOG_PENALTY_BASE * (1 - centeredness);
      newWidth = Math.max(0, newWidth - extraShrink);
      shakeTime = 0.35;
      shakeMag = 8;
      addPopup('ワン！ぐらぐら…', '#e07a3f');
      if (newWidth <= 4) {
        addDebris(newX, topScreenY - BLOCK_HEIGHT, Math.max(newWidth, 6));
        endGame();
        return;
      }
    }

    if (isPerfect) {
      combo += 1;
      score += 10 + combo * 2;
      addPopup(combo > 1 ? `PERFECT! x${combo}` : 'PERFECT!', '#2ec4b6');
    } else {
      combo = 0;
      score += 5;
    }

    stack.push({ x: newX, width: newWidth, type: mb.type });
    dogChance = Math.min(0.4, dogChance + 0.015);
    spawnMovingBlock(newWidth);

    scoreText.textContent = score;
    comboText.textContent = combo > 1 ? `combo x${combo}` : '';
  }

  canvas.addEventListener('pointerdown', drop);
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') drop();
  });

  function update(dt) {
    // moving block bounce
    const mb = movingBlock;
    mb.x += mb.dir * mb.speed * dt;
    if (mb.x - mb.width / 2 < MARGIN) {
      mb.x = MARGIN + mb.width / 2;
      mb.dir = 1;
    } else if (mb.x + mb.width / 2 > W - MARGIN) {
      mb.x = W - MARGIN - mb.width / 2;
      mb.dir = -1;
    }

    // debris physics
    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.vy += 260 * dt;
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.rot += d.vrot * dt;
      d.life -= dt;
      if (d.life <= 0 || d.y > H + 100) debris.splice(i, 1);
    }

    // popups
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i];
      p.life -= dt;
      p.y -= 24 * dt;
      if (p.life <= 0) popups.splice(i, 1);
    }

    if (shakeTime > 0) shakeTime -= dt;
  }

  function blockColor(type) {
    return type === 'dog' ? '#f0b27a' : '#ffd9e8';
  }
  function blockBorder(type) {
    return type === 'dog' ? '#c9762f' : '#e8749a';
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // sky gradient background already via CSS; draw simple ground hint
    ctx.save();
    let shakeX = 0, shakeY = 0;
    if (shakeTime > 0) {
      shakeX = (Math.random() - 0.5) * shakeMag;
      shakeY = (Math.random() - 0.5) * shakeMag;
      ctx.translate(shakeX, shakeY);
    }

    // draw stack from top down
    for (let k = 0; k < stack.length; k++) {
      const idxFromTop = stack.length - 1 - k;
      const b = stack[k];
      const y = topScreenY + idxFromTop * BLOCK_HEIGHT;
      if (y > H + BLOCK_HEIGHT) continue;
      ctx.fillStyle = blockColor(b.type);
      ctx.strokeStyle = blockBorder(b.type);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(b.x - b.width / 2, y, b.width, BLOCK_HEIGHT - 4, 6);
      ctx.fill();
      ctx.stroke();
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.type === 'dog' ? '🐶' : '🐱', b.x, y + (BLOCK_HEIGHT - 4) / 2);
    }

    // moving block
    if (state === 'playing') {
      const mb = movingBlock;
      const y = topScreenY - BLOCK_HEIGHT;
      ctx.fillStyle = blockColor(mb.type);
      ctx.strokeStyle = blockBorder(mb.type);
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(mb.x - mb.width / 2, y, mb.width, BLOCK_HEIGHT - 4, 6);
      ctx.fill();
      ctx.stroke();
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(mb.type === 'dog' ? '🐶' : '🐱', mb.x, y + (BLOCK_HEIGHT - 4) / 2);
      if (mb.type === 'dog') {
        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = '#c9762f';
        ctx.fillText('お邪魔！', mb.x, y - 12);
      }
    }

    // debris
    debris.forEach(d => {
      ctx.save();
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, d.life));
      ctx.fillStyle = '#d9a0b0';
      ctx.fillRect(-d.width / 2, -d.height / 2, d.width, d.height - 4);
      ctx.restore();
    });
    ctx.globalAlpha = 1;

    // popups
    popups.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.9));
      ctx.font = 'bold 22px sans-serif';
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    });

    ctx.restore();
  }

  let lastTime = null;
  function loop(ts) {
    if (state !== 'playing') { lastTime = null; return; }
    if (lastTime === null) lastTime = ts;
    const dt = Math.min(0.05, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resetGame();
    state = 'playing';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    hud.classList.remove('hidden');
    scoreText.textContent = '0';
    comboText.textContent = '';
    lastTime = null;
    requestAnimationFrame(loop);
  }

  function endGame() {
    state = 'gameover';
    hud.classList.add('hidden');
    finalScoreEl.textContent = score;
    gameOverScreen.classList.remove('hidden');
    draw();
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  // idle initial draw
  resetGame();
  draw();
})();
</script>
</body>
</html>
