<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>お面の神経衰弱</title>
<style>
  :root{
    --bg1:#fff2e0;
    --bg2:#ffd9c2;
    --accent:#e6483c;
    --accent-dark:#b8332a;
    --card-back1:#c0392b;
    --card-back2:#8e2417;
    --gold:#e8b23c;
    --text:#3b2a20;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--text);
    overscroll-behavior:none;
    user-select:none;
    touch-action:manipulation;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:12px;
  }
  .screen{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .hidden{display:none !important;}

  h1.title{
    font-size:clamp(24px,6vw,38px);
    color:var(--accent-dark);
    margin:18px 0 6px;
    text-shadow:1px 1px 0 #fff;
  }
  p.sub{
    font-size:clamp(13px,3vw,16px);
    color:#6b4a38;
    margin:0 0 20px;
    line-height:1.6;
  }
  .mask-preview{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    width:min(80vw,320px);
    margin-bottom:22px;
  }
  .mask-preview svg, .mask-preview img{width:100%; display:block;}

  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
  }
  .btn-primary{
    background:linear-gradient(180deg,#ff8a5c,var(--accent));
    color:#fff;
    font-size:clamp(18px,4.5vw,22px);
    font-weight:bold;
    padding:14px 46px;
    border-radius:50px;
    box-shadow:0 6px 0 var(--accent-dark), 0 8px 14px rgba(0,0,0,0.2);
    transition:transform .08s;
  }
  .btn-primary:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 var(--accent-dark), 0 4px 8px rgba(0,0,0,0.2);
  }
  .btn-secondary{
    background:#fff;
    color:var(--accent-dark);
    border:2px solid var(--accent);
    font-size:clamp(14px,3.5vw,16px);
    font-weight:bold;
    padding:10px 28px;
    border-radius:40px;
    margin-top:14px;
  }

  /* ---- HUD ---- */
  .hud{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    max-width:520px;
    margin:6px 0 12px;
    padding:0 4px;
  }
  .hud-item{
    background:#fff;
    border-radius:14px;
    padding:8px 16px;
    box-shadow:0 3px 0 rgba(0,0,0,0.08);
    font-weight:bold;
    font-size:clamp(13px,3.2vw,16px);
    color:var(--accent-dark);
    min-width:78px;
  }
  .hud-item span.label{
    display:block;
    font-size:10px;
    color:#a3806f;
    font-weight:normal;
  }

  /* ---- Board ---- */
  #board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    width:100%;
    max-width:520px;
    margin:0 auto;
  }
  .card{
    aspect-ratio:1/1;
    perspective:800px;
  }
  .card-inner{
    position:relative;
    width:100%; height:100%;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card.matched .card-inner{transform:rotateY(180deg);}
  .card-face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    backface-visibility:hidden;
    box-shadow:0 3px 6px rgba(0,0,0,0.15);
  }
  .card-face-down{
    background:
      radial-gradient(circle at 30% 30%, var(--card-back1), var(--card-back2));
    border:3px solid var(--gold);
  }
  .card-face-down::after{
    content:"?";
    color:var(--gold);
    font-size:clamp(20px,6vw,30px);
    font-weight:bold;
    opacity:.8;
  }
  .card-face-up{
    background:#fff8ee;
    transform:rotateY(180deg);
    border:3px solid #f0ddc4;
    padding:6%;
  }
  .card.matched .card-face-up{
    border-color:#7ec87e;
    background:#f2fbf0;
  }
  .card-face-up svg, .card-face-up img{width:100%; height:100%; object-fit:contain; display:block;}
  .card:not(.locked-out) .card-inner{cursor:pointer;}

  @keyframes pop{
    0%{transform:scale(1);}
    40%{transform:scale(1.08);}
    100%{transform:scale(1);}
  }
  .card.matched{animation:pop .35s ease;}

  /* ---- Result overlay ---- */
  #resultOverlay{
    position:fixed; inset:0;
    background:rgba(59,42,32,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:16px;
    z-index:20;
  }
  .result-card{
    background:#fffaf3;
    border-radius:24px;
    padding:30px 26px;
    max-width:360px;
    width:100%;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    animation:pop .4s ease;
  }
  .result-card h2{
    margin:0 0 4px;
    color:var(--accent-dark);
    font-size:22px;
  }
  .rank-badge{
    font-size:64px;
    font-weight:bold;
    margin:10px 0;
    line-height:1;
  }
  .rank-S{color:#e8b23c;}
  .rank-A{color:#e6483c;}
  .rank-B{color:#7a9ac9;}
  .result-stats{
    display:flex;
    justify-content:space-around;
    margin:14px 0 20px;
  }
  .result-stats div{font-size:14px; color:#6b4a38;}
  .result-stats strong{display:block; font-size:20px; color:var(--text);}
</style>
</head>
<body>
<div id="app">

  <!-- Title Screen -->
  <div id="titleScreen" class="screen">
    <h1 class="title">お面の神経衰弱</h1>
    <p class="sub">おなじ「おめん」のペアを見つけよう！<br>カードを2まいめくって、絵をあわせてね。</p>
    <div class="mask-preview" id="maskPreview"></div>
    <button class="btn-primary" id="startBtn">スタート</button>
  </div>

  <!-- Game Screen -->
  <div id="gameScreen" class="screen hidden">
    <div class="hud">
      <div class="hud-item"><span class="label">タイム</span><span id="timeDisplay">0秒</span></div>
      <div class="hud-item"><span class="label">てすう</span><span id="movesDisplay">0</span></div>
      <div class="hud-item"><span class="label">ペア</span><span id="pairsDisplay">0 / 8</span></div>
    </div>
    <div id="board"></div>
  </div>

  <!-- Result Overlay -->
  <div id="resultOverlay" class="hidden">
    <div class="result-card">
      <h2>クリア！</h2>
      <div class="rank-badge" id="rankBadge">S</div>
      <div class="result-stats">
        <div><strong id="finalTime">0秒</strong>タイム</div>
        <div><strong id="finalMoves">0</strong>てすう</div>
        <div><strong id="finalScore">0</strong>スコア</div>
      </div>
      <button class="btn-primary" id="retryBtn" style="font-size:16px; padding:10px 34px;">もう一度あそぶ</button>
    </div>
  </div>

</div>

  // ---------- State ----------
  let deck = [];
  let firstCard = null, secondCard = null;
  let lock = false;
  let moves = 0, matchedPairs = 0;
  let timerInterval = null, elapsedSec = 0;

  const boardEl = document.getElementById("board");
  const titleScreen = document.getElementById("titleScreen");
  const gameScreen = document.getElementById("gameScreen");
  const resultOverlay = document.getElementById("resultOverlay");
  const timeDisplay = document.getElementById("timeDisplay");
  const movesDisplay = document.getElementById("movesDisplay");
  const pairsDisplay = document.getElementById("pairsDisplay");

  // Preview a few masks on title screen
  const previewEl = document.getElementById("maskPreview");
  MASKS.slice(0,4).forEach(m => {
    const div = document.createElement("div");
    div.innerHTML = m.art;
    previewEl.appendChild(div);
  });

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  function buildDeck(){
    deck = shuffle(MASKS.concat(MASKS).map((m,i)=>({...m, id:i})));
  }

  function renderBoard(){
    boardEl.innerHTML = "";
    deck.forEach((cardData) => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.key = cardData.key;
      card.dataset.id = cardData.id;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-face card-face-down"></div>
          <div class="card-face card-face-up">${cardData.art}</div>
        </div>`;
      card.addEventListener("click", onCardClick);
      boardEl.appendChild(card);
    });
  }

  function onCardClick(e){
    const card = e.currentTarget;
    if(lock) return;
    if(card.classList.contains("flipped") || card.classList.contains("matched")) return;

    card.classList.add("flipped");

    if(!firstCard){
      firstCard = card;
      return;
    }
    secondCard = card;
    lock = true;
    moves++;
    movesDisplay.textContent = moves;

    const isMatch = firstCard.dataset.key === secondCard.dataset.key;
    if(isMatch){
      firstCard.classList.add("matched");
      secondCard.classList.add("matched");
      matchedPairs++;
      pairsDisplay.textContent = matchedPairs + " / 8";
      resetTurn();
      if(matchedPairs === 8){
        setTimeout(finishGame, 500);
      }
    } else {
      setTimeout(() => {
        firstCard.classList.remove("flipped");
        secondCard.classList.remove("flipped");
        resetTurn();
      }, 750);
    }
  }

  function resetTurn(){
    firstCard = null;
    secondCard = null;
    lock = false;
  }

  function startTimer(){
    elapsedSec = 0;
    timeDisplay.textContent = "0秒";
    timerInterval = setInterval(() => {
      elapsedSec++;
      timeDisplay.textContent = elapsedSec + "秒";
    }, 1000);
  }

  function stopTimer(){
    clearInterval(timerInterval);
  }

  function calcRank(m, s){
    const score = Math.max(0, Math.round(1000 - (m-8)*40 - s*3));
    let rank = "B";
    if(score >= 800) rank = "S";
    else if(score >= 500) rank = "A";
    return {score, rank};
  }

  function finishGame(){
    stopTimer();
    const {score, rank} = calcRank(moves, elapsedSec);
    document.getElementById("finalTime").textContent = elapsedSec + "秒";
    document.getElementById("finalMoves").textContent = moves;
    document.getElementById("finalScore").textContent = score;
    const badge = document.getElementById("rankBadge");
    badge.textContent = rank;
    badge.className = "rank-badge rank-" + rank;
    resultOverlay.classList.remove("hidden");
  }

  function startGame(){
    moves = 0; matchedPairs = 0;
    movesDisplay.textContent = "0";
    pairsDisplay.textContent = "0 / 8";
    resultOverlay.classList.add("hidden");
    buildDeck();
    renderBoard();
    titleScreen.classList.add("hidden");
    gameScreen.classList.remove("hidden");
    startTimer();
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);

})();
</script>
</body>
</html>
